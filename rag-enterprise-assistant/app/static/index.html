<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Enterprise Assistant</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:30px auto;padding:0 16px;background:#f6f7f9;color:#1d2330}
  h1{font-size:22px}
  .box{background:#fff;border:1px solid #dde1e8;border-radius:10px;padding:14px;margin-bottom:14px}
  input[type=text]{width:100%;padding:10px;border:1px solid #c5cbd6;border-radius:8px;box-sizing:border-box;font-size:15px}
  button{margin-top:8px;padding:9px 16px;border:0;border-radius:8px;background:#2f5bea;color:#fff;font-size:14px;cursor:pointer}
  pre{white-space:pre-wrap;font-family:inherit;margin:0}
  .src{font-size:13px;color:#5b6477;margin-top:8px}
  #status{font-size:13px;color:#5b6477;margin-bottom:10px}
</style>
</head>
<body>
<h1>Assistant d'entreprise (RAG)</h1>
<div id="status"></div>
<div class="box">
  <input id="q" type="text" placeholder="Posez votre question sur les documents..." />
  <button onclick="ask()">Demander</button>
</div>
<div class="box" id="out" style="display:none">
  <pre id="answer"></pre>
  <div class="src" id="sources"></div>
</div>
<div class="box">
  <b>Ajouter un document (.txt / .md)</b><br>
  <input type="file" id="file" accept=".txt,.md">
  <button onclick="upload()">Indexer</button>
  <div id="upmsg" class="src"></div>
</div>
<script>
const $ = id => document.getElementById(id);
async function health(){
  const r = await (await fetch('/api/health')).json();
  $('status').textContent = r.chunks + ' passages indexes';
}
async function ask(){
  const question = $('q').value.trim();
  if(!question) return;
  $('out').style.display='block';
  $('answer').textContent='Recherche...'; $('sources').textContent='';
  const r = await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});
  const d = await r.json();
  $('answer').textContent = d.answer || d.detail;
  $('sources').textContent = d.sources && d.sources.length ? 'Sources : ' + d.sources.join(', ') : '';
}
async function upload(){
  const f = $('file').files[0]; if(!f) return;
  const fd = new FormData(); fd.append('file', f);
  const r = await fetch('/api/upload',{method:'POST',body:fd});
  const d = await r.json();
  $('upmsg').textContent = r.ok ? d.file + ' indexe (' + d.chunks + ' passages)' : d.detail;
  health();
}
$('q').addEventListener('keydown', e => { if(e.key==='Enter') ask(); });
health();
</script>
</body>
</html>
